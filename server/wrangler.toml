# The online relay for King of the Beasts: pairs two players by room code and passes their
# messages back and forth. Deployed to Cloudflare Workers (free plan) by .github/workflows/server.yml.
name = "kotb-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed classes are the ones the free plan allows. Rooms keep nothing in storage.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
