name: Android CI/CD

on:
  push:
    branches: [main, master, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to build and publish, e.g. 0.1.0 (creates tag v<version>). Leave empty for a normal CI run."
        required: false
        default: ""
      commit:
        description: "Commit to build the release from (default: the branch head). Lets you release an older state."
        required: false
        default: ""

# A new push cancels the previous CI run on the same branch, but never a manual release run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  test:
    name: Tests & lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Rules engine unit tests
        run: ./gradlew :core:test --stacktrace
      - name: App UI tests (Robolectric)
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

  build:
    name: Debug APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug -PversionCode=${{ github.run_number }} -PdevBuild=${{ github.run_number }}
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: KingOfTheBeasts-dev-${{ github.run_number }}
          path: app/build/outputs/apk/debug/KingOfTheBeasts-*.apk
          retention-days: 30

  release:
    name: Release APK
    # Runs for a pushed v* tag, or from the Actions tab ("Run workflow" with a version).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Decode signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Assemble release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          RELEASE_VERSION="${VERSION#v}"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          ./gradlew :app:assembleRelease -PversionCode=${{ github.run_number }} -PversionName="$RELEASE_VERSION"
          # Older commits name the APK app-release.apk; newer ones KingOfTheBeasts-<version>.apk.
          cp app/build/outputs/apk/release/*.apk "KingOfTheBeasts-$RELEASE_VERSION.apk"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          # For a manual run the action creates the tag on the commit being built.
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ inputs.commit || github.sha }}
          files: KingOfTheBeasts-*.apk
          generate_release_notes: true
